<style>
:root{--ink:#243244;--red:#A6192E;--canvas:#F4F1EC;--surface:#FFFFFF;--line:#E8E3DC;--muted:#6E675F;--teal:#006666;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--canvas);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.top{background:linear-gradient(180deg,#2C3A4B,#243244);color:#fff;padding-block:22px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top .k{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#9FBACB}
.top h1{font-size:20px;margin-top:6px}
main{flex:1;display:grid;place-items:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:16px;padding:26px 24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 6px rgba(36,50,68,.06),0 10px 28px rgba(36,50,68,.07)}
label{font-size:13px;font-weight:700}
input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:8px;width:100%}
input:focus{outline:none;border-color:#0B769F;box-shadow:0 0 0 3px rgba(11,118,159,.18)}
button{font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;border-radius:8px;background:var(--red);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
p{font-size:13px;color:var(--muted);line-height:1.5}
#err{color:var(--red);font-weight:600}
</style>
</head>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.i)}, key, u8(P.c));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; b.textContent = 'Abriendo…'; err.hidden = true;
  try {
    const html = await abrir(document.getElementById('pw').value.trim().toLowerCase());
    document.open(); document.write(html); document.close();
  } catch (x) { err.hidden = false; b.disabled = false; b.textContent = 'Abrir el Atlas'; }
});
